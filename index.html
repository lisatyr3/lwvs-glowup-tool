<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Glow Up Tool</title>

<style>
body{
  font-family:system-ui;
  max-width:800px;
  margin:40px auto;
  text-align:center;
}
button{
  background:#b07c69;
  color:white;
  padding:14px 24px;
  border:none;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}
#results{
  margin-top:30px;
  text-align:left;
}
</style>
</head>

<body>

<h2>Glow-Up Analyzer</h2>

<input type="file" id="photoInput" accept="image/*"><br><br>

<button onclick="analyze()">Analyze My Photo</button>

<div id="results"></div>

<script>

async function analyze(){

  const fileInput = document.getElementById("photoInput");
  const results = document.getElementById("results");

  if (!fileInput.files.length) {
    alert("Please upload a photo");
    return;
  }

  const formData = new FormData();
  formData.append("image", fileInput.files[0]);

  results.innerHTML = "Analyzing...";

  try {

    const response = await fetch("https://lwfs-glowup.lisa-668.workers.dev/", {
      method: "POST",
      body: formData
    });

    const text = await response.text();

    console.log("SERVER RESPONSE:", text);

    results.innerHTML = text;

  } catch (error) {

    console.error("FETCH ERROR:", error);

    results.innerHTML = "Error: " + error.message;

  }
}

</script>

</body>
</html>
