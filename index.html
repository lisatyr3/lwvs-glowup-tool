<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Glow Up Tool</title>

<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
  max-width: 800px;
  margin: 40px auto;
  text-align: center;
  color: #333;
  line-height: 1.6;
}
button {
  background: #b07c69;
  color: white;
  padding: 14px 24px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  transition: background 0.3s;
}
button:hover {
  background: #966656;
}
#results {
  margin-top: 30px;
  text-align: left;
  padding: 20px;
  border-radius: 12px;
}
.error-msg {
  background-color: #fffaf0;
  border: 1px solid #e0d5c1;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  color: #555;
}
.loading-msg {
  text-align: center;
  font-style: italic;
  color: #b07c69;
}
</style>
</head>

<body>

<h2>Glow-Up Analyzer</h2>

<input type="file" id="photoInput" accept="image/*"><br><br>

<button id="analyzeBtn" onclick="analyze()">Analyze My Photo</button>

<div id="results"></div>

<script>

async function analyze(){

  const fileInput = document.getElementById("photoInput");
  const results = document.getElementById("results");

  // REPLACED ALERT WITH IN-PAGE MESSAGE
  if (!fileInput.files.length) {
    results.innerHTML = `
      <div class="error-msg">
        <p>Oops! I’d love to help, but I need a photo first so I can see your lovely face. 💕</p>
      </div>
    `;
    return;
  }

  const formData = new FormData();
  formData.append("image", fileInput.files[0]);

  results.innerHTML = "<p class='loading-msg'>Looking at your photo now... just a moment! ✨</p>";

  try {
    const response = await fetch("https://lwfs-glowup.lisa-668.workers.dev/", {
      method: "POST",
      body: formData
    });

    const text = await response.text();

    console.log("SERVER RESPONSE:", text);

    // If the worker returns a status error, we show it nicely
    if (!response.ok) {
        results.innerHTML = `<div class="error-msg">${text}</div>`;
    } else {
        results.innerHTML = text;
    }

  } catch (error) {
    console.error("FETCH ERROR:", error);
    results.innerHTML = `<div class="error-msg">I'm having a little trouble connecting. Please try again in a moment!</div>`;
  }
}

</script>

</body>
</html>
